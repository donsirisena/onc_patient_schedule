<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Type"
        content="XMLCCLREQUEST,APPLINK,MPAGES_EVENT"
        name="discern"
    >

    <title>Oncology Apoointments Schedule</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->
    <div class="page-header">

        <img
            src="logo.png"
            alt="Organization logo"
            class="page-logo"
        >

        <div>
            <h1>Oncology Appointment Schedule</h1>
            <p>Upcoming and Completed Treatment Appointments</p>
        </div>

    </div>


    <!-- MAIN PAGE -->
    <div class="container">

    <!-- TOOLBAR -->
        <div class="toolbar">

       <div class="toolbar-title">
        Chemo Appointments
       </div>

        <div class="toolbar-actions">

        <div class="view-toggle">

            <button
                id="futureButton"
                class="view-button active"
                type="button"
            >
                Future Appointments
            </button>

            <button
                id="completedButton"
                class="view-button"
                type="button"
            >
                Completed Appointments
            </button>

        </div>

        <button
            id="refreshButton"
            class="primary-button"
            type="button"
        >
            Refresh
        </button>

        </div>

        </div>


        <!-- STATUS -->
        <div
            id="statusMessage"
            class="status"
        >
            Loading upcoming appointments...
        </div>


        <!-- SCHEDULE -->
        <div
            id="scheduleContainer"
            class="schedule-container"
        >
        </div>


        <!-- EMPTY STATE -->
        <div
            id="emptyMessage"
            class="empty-message"
            style="display:none;"
        >
            No upcoming oncology appointments were found.
        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
